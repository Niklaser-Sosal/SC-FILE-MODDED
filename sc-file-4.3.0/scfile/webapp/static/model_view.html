<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SC-FILE:MODDED • Model View</title>
    <link rel="icon" type="image/png" href="/static/app_icon.png" />
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
      :root {
        --accent: #ffd400;
        --bg: #0b0b0b;
        --panel: #121212;
        --text: #ffffff;
        --muted: #cfcfcf;
        --grid-line: color-mix(in srgb, var(--accent) 55%, transparent);
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background:
          radial-gradient(1100px 700px at 20% 0%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 56%),
          var(--bg);
        color: var(--text);
        font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
      }
      .app {
        height: 100%;
        display: grid;
        grid-template-rows: auto auto 1fr auto;
        gap: 8px;
        padding: 10px;
      }
      .card {
        border: 1px solid color-mix(in srgb, var(--accent) 28%, #ffffff22);
        border-radius: 12px;
        background: color-mix(in srgb, var(--panel) 88%, #000000 12%);
      }
      .head {
        padding: 10px 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .title-row {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .title-icon {
        width: 34px;
        height: 34px;
        display: inline-block;
        background: var(--accent);
        -webkit-mask: url("/static/modelki.svg") center / contain no-repeat;
        mask: url("/static/modelki.svg") center / contain no-repeat;
        filter: drop-shadow(0 0 10px color-mix(in srgb, var(--accent) 50%, transparent));
      }
      .title {
        font-weight: 900;
        font-size: 20px;
      }
      .subtitle {
        color: var(--muted);
        font-size: 12px;
        margin-top: 2px;
      }
      .actions, .controls {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        padding: 8px 10px;
      }
      .btn {
        all: unset;
        cursor: pointer;
        border: 1px solid #ffffff22;
        border-radius: 9px;
        padding: 8px 11px;
        background: #ffffff10;
        font-size: 12.5px;
        font-weight: 700;
        line-height: 1;
      }
      .btn:hover {
        border-color: color-mix(in srgb, var(--accent) 60%, #ffffff22);
        box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 38%, transparent);
        background: #ffffff18;
      }
      .btn.active {
        border-color: color-mix(in srgb, var(--accent) 68%, #ffffff22);
        background: color-mix(in srgb, var(--accent) 20%, #ffffff08);
      }
      .group {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border: 1px solid #ffffff24;
        border-radius: 10px;
        padding: 6px 10px;
        background: #ffffff0a;
      }
      .group label {
        font-size: 12px;
        color: var(--muted);
        white-space: nowrap;
      }
      input[type="range"] {
        width: 140px;
        accent-color: var(--accent);
      }
      .value {
        min-width: 52px;
        text-align: right;
        font-size: 12px;
      }
      #matTint {
        width: 28px;
        height: 24px;
        border: 1px solid #ffffff24;
        border-radius: 6px;
        padding: 0;
        background: transparent;
      }
      .viewer-wrap {
        position: relative;
        min-height: 0;
        overflow: hidden;
      }
      model-viewer {
        width: 100%;
        height: 100%;
        background: linear-gradient(180deg, #ffffff08, #00000058);
      }
      .model-grid-floor {
        position: absolute;
        left: -24%;
        right: -24%;
        bottom: -42%;
        height: 85%;
        pointer-events: none;
        opacity: 0.7;
        transform: perspective(1200px) rotateX(76deg);
        transform-origin: 50% 100%;
        background-image:
          linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
          linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
        background-size: 40px 40px, 40px 40px;
        mask-image: radial-gradient(ellipse at center, #000000 32%, #000000 56%, transparent 86%);
        filter: drop-shadow(0 0 10px color-mix(in srgb, var(--accent) 45%, transparent));
      }
      .model-grid-floor.hidden {
        display: none;
      }
      .watermark {
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 0.48;
        mix-blend-mode: normal;
        background-repeat: repeat;
        background-size: 860px 460px;
        animation: wm-drift 24s linear infinite;
      }
      @keyframes wm-drift {
        from { background-position: 0 0; }
        to { background-position: 380px 210px; }
      }
      .unsupported {
        position: absolute;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        text-align: center;
        color: var(--muted);
        font-size: 14px;
        background: #00000090;
        padding: 18px;
      }
      .unsupported.active { display: flex; }
      .status {
        min-height: 24px;
        font-size: 12px;
        color: var(--muted);
        padding: 0 4px;
        display: flex;
        align-items: center;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="card head">
        <div>
          <div class="title-row">
            <span class="title-icon" aria-hidden="true"></span>
            <div class="title" id="title">Осмотр модели</div>
          </div>
          <div class="subtitle" id="subtitle">Файл: —</div>
        </div>
      </div>

      <div class="card">
        <div class="actions">
          <a class="btn" id="btnDownload" target="_blank" rel="noopener">Скачать</a>
          <button class="btn" id="btnReset" type="button">Сброс камеры</button>
          <button class="btn active" id="btnAuto" type="button">Авто: ВКЛ</button>
          <button class="btn active" id="btnGrid" type="button">Сетка модели: ВКЛ</button>
          <button class="btn" id="btnFront" type="button">Front</button>
          <button class="btn" id="btnSide" type="button">Side</button>
          <button class="btn" id="btnTop" type="button">Top</button>
          <button class="btn" id="btnMaterialReset" type="button">Материал: Сброс</button>
        </div>
        <div class="controls">
          <div class="group">
            <label id="lblRotateSpeed" for="rotateSpeed">Скорость</label>
            <input id="rotateSpeed" type="range" min="5" max="120" step="1" value="30" />
            <span class="value" id="rotateSpeedValue">30°/s</span>
          </div>
          <div class="group">
            <label id="lblExposure" for="lightExposure">Свет</label>
            <input id="lightExposure" type="range" min="40" max="260" step="1" value="100" />
            <span class="value" id="lightExposureValue">1.00</span>
          </div>
          <div class="group">
            <label id="lblShadow" for="lightShadow">Тень</label>
            <input id="lightShadow" type="range" min="0" max="200" step="1" value="100" />
            <span class="value" id="lightShadowValue">1.00</span>
          </div>
          <div class="group">
            <label id="lblMetal" for="matMetalness">Metal</label>
            <input id="matMetalness" type="range" min="0" max="100" step="1" value="22" />
            <span class="value" id="matMetalnessValue">0.22</span>
          </div>
          <div class="group">
            <label id="lblRough" for="matRoughness">Rough</label>
            <input id="matRoughness" type="range" min="0" max="100" step="1" value="68" />
            <span class="value" id="matRoughnessValue">0.68</span>
          </div>
          <div class="group">
            <label id="lblTint" for="matTint">Tint</label>
            <input id="matTint" type="color" value="#ffffff" />
          </div>
        </div>
      </div>

      <div class="card viewer-wrap">
        <model-viewer
          id="viewer"
          camera-controls
          auto-rotate
          interaction-prompt="none"
          shadow-intensity="1"
          exposure="1"
          ar
        ></model-viewer>
        <div class="model-grid-floor" id="modelGridFloor"></div>
        <div class="watermark" id="watermark"></div>
        <div class="unsupported" id="unsupported"></div>
      </div>

      <div class="status" id="status"></div>
    </div>
    <script type="module" src="/static/model_view.js"></script>
  </body>
</html>
